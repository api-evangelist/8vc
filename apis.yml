aid: 8vc
name: 8VC
description: >-
  8VC is a technology investment firm founded in 2015 by Joe Lonsdale and Jake Medwell (with founding
  partners Drew Oetting and Kimmy Scotti) following the wind-down of Formation 8, and headquartered at
  907 South Congress Avenue in Austin, Texas after relocating from San Francisco in 2020. The firm both
  invests in and co-founds early-stage companies, dedicating a significant share of its capital (roughly
  25-30%) to building companies from scratch through its "8VC Build" venture-studio program and assembling
  teams of top specialists. 8VC concentrates on "national capability" and deep-tech categories including
  defense, life sciences and biotech, healthcare, logistics and supply chain, manufacturing and
  industrials, enterprise software, financial services, AI, and IT infrastructure. With approximately
  $6 billion in assets under management (2023) and a public portfolio of more than 170 companies, 8VC is
  known for its founder-led, mission-driven approach and notable investments including Palantir, Addepar,
  Anduril, Flexport, Vercel, Saronic, Epirus, Yugabyte, and Project44. The firm runs the 8VC Fellowship
  and Bio-IT Fellowship talent programs and maintains a stated policy of not accepting capital from
  foreign-government-connected sources.
